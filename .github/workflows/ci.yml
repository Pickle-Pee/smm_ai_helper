name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - sale-ready

jobs:
  python:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: durable_job_test_ci
          POSTGRES_USER: smm_user
          POSTGRES_PASSWORD: smm_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U smm_user -d durable_job_test_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://smm_user:smm_pass@localhost:5432/smm_mvp_test_ci
      DURABLE_JOB_TEST_DATABASE_URL: postgresql+asyncpg://smm_user:smm_pass@localhost:5432/durable_job_test_ci
      MVP_TEST_DATABASE_URL: postgresql+asyncpg://smm_user:smm_pass@localhost:5432/smm_mvp_test_ci
      REDIS_TEST_URL: redis://localhost:6379/15
      TELEGRAM_BOT_TOKEN: test-telegram-token
      API_BASE_URL: http://localhost:8000
      OPENAI_API_KEY: test-openai-key
      OPENAI_BASE_URL: https://api.openai.com/v1
      IMAGE_STORAGE_PATH: /tmp/smm-ai-helper-images

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall app bot

      - name: Create separate disposable MVP database
        env:
          PGPASSWORD: smm_pass
        run: createdb -h localhost -U smm_user smm_mvp_test_ci

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: smm-mvp-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure isolated services with disabled external providers
        run: |
          cat > .env <<'ENV'
          DATABASE_URL=postgresql+asyncpg://smm_user:smm_pass@db:5432/smm_swarm
          REDIS_URL=redis://redis:6379/0
          API_BASE_URL=http://backend:8000
          IMAGE_STORAGE_PATH=/data/images
          BOT_BACKEND_TOKEN=offline-container-secret
          TELEGRAM_BOT_TOKEN=123456:offline-container-token
          OPENAI_API_KEY=offline-container-key
          OPENAI_BASE_URL=http://127.0.0.1:9
          ENV

      - name: Build and start backend and worker (no Telegram polling)
        run: docker compose up --build --wait --wait-timeout 120 -d db redis backend worker

      - name: Exercise the built image with real PostgreSQL and Redis
        run: |
          docker compose exec -T db createdb -U smm_user smm_mvp_test_container
          docker compose run --rm -T --no-deps \
            -e DATABASE_URL=postgresql+asyncpg://smm_user:smm_pass@db:5432/smm_mvp_test_container \
            -e MVP_TEST_DATABASE_URL=postgresql+asyncpg://smm_user:smm_pass@db:5432/smm_mvp_test_container \
            -e REDIS_TEST_URL=redis://redis:6379/15 \
            -v "$PWD/tests:/app/tests:ro" \
            backend python -m pytest -q --tb=short \
              tests/test_marketing_mvp_postgresql.py tests/test_workflow_provider_protocols.py tests/test_workflow_redis.py \
              tests/test_production_graph_worker.py tests/test_graph_model_adapter.py tests/test_production_worker_postgresql.py \
              tests/test_copilot_api.py tests/test_copilot_api_postgresql.py \
              tests/test_telegram_copilot.py tests/test_telegram_copilot_postgresql.py

      - name: Verify persistence after app container recreation
        run: |
          python scripts/check_container_persistence.py seed
          docker compose up --no-build --no-deps --force-recreate --wait --wait-timeout 60 -d backend worker
          python scripts/check_container_persistence.py verify

      - name: Verify both worker lane families, Redis recovery and graceful shutdown
        run: python scripts/check_worker_lanes.py

      - name: Service diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100 db redis migrate backend worker

      - name: Remove the disposable CI project
        if: always()
        run: docker compose down --volumes --remove-orphans
