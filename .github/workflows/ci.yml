name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - sale-ready

jobs:
  python:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: durable_job_test_ci
          POSTGRES_USER: smm_user
          POSTGRES_PASSWORD: smm_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U smm_user -d durable_job_test_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://smm_user:smm_pass@localhost:5432/smm_mvp_test_ci
      DURABLE_JOB_TEST_DATABASE_URL: postgresql+asyncpg://smm_user:smm_pass@localhost:5432/durable_job_test_ci
      MVP_TEST_DATABASE_URL: postgresql+asyncpg://smm_user:smm_pass@localhost:5432/smm_mvp_test_ci
      TELEGRAM_BOT_TOKEN: test-telegram-token
      API_BASE_URL: http://localhost:8000
      OPENAI_API_KEY: test-openai-key
      OPENAI_BASE_URL: https://api.openai.com/v1
      IMAGE_STORAGE_PATH: /tmp/smm-ai-helper-images

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall app bot

      - name: Create separate disposable MVP database
        env:
          PGPASSWORD: smm_pass
        run: createdb -h localhost -U smm_user smm_mvp_test_ci

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest
